<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Universe 🌙</title><style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020516;
    font-family: Georgia, serif;
    color: white;
}

.scene {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background:
        radial-gradient(circle at 75% 20%, #14275c 0%, #070d2b 35%, #020516 75%);
}

/* MOON */

.moon {
    position: absolute;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    top: 8%;
    right: 12%;
    background: #eef9ff;
    box-shadow:
        0 0 20px #d8f3ff,
        0 0 60px #6dbdff,
        0 0 120px rgba(90,170,255,.35);
    opacity: 0;
    animation: moonAppear 4s ease forwards;
}

/* STARS */

.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    opacity: 0;
    animation: starAppear 2s ease forwards, twinkle 2s ease-in-out infinite alternate;
}

.s1 { top: 15%; left: 15%; animation-delay: 1s; }
.s2 { top: 28%; left: 35%; animation-delay: 1.4s; }
.s3 { top: 12%; left: 60%; animation-delay: 1.8s; }
.s4 { top: 40%; left: 80%; animation-delay: 2.1s; }
.s5 { top: 65%; left: 12%; animation-delay: 2.4s; }
.s6 { top: 75%; left: 75%; animation-delay: 2.7s; }
.s7 { top: 52%; left: 50%; animation-delay: 3s; }
.s8 { top: 85%; left: 35%; animation-delay: 3.3s; }
.s9 { top: 22%; left: 90%; animation-delay: 3.6s; }
.s10 { top: 60%; left: 92%; animation-delay: 3.9s; }

/* TEXT */

.intro {
    position: absolute;
    width: 90%;
    left: 5%;
    top: 43%;
    text-align: center;
    opacity: 0;
    animation: introAppear 3s ease 4s forwards;
}

.intro p {
    margin: 8px 0;
    font-size: 15px;
    letter-spacing: 3px;
    color: #a9cfff;
}

.intro h1 {
    margin: 15px 0;
    font-size: 27px;
    line-height: 1.4;
    font-weight: normal;
    text-shadow: 0 0 18px #78bfff;
}

/* LITTLE GLOW */

.glow {
    position: absolute;
    width: 220px;
    height: 80px;
    bottom: -20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(60,140,255,.18);
    filter: blur(35px);
}

/* ANIMATIONS */

@keyframes moonAppear {
    from {
        opacity: 0;
        transform: scale(.5);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes starAppear {
    from {
        opacity: 0;
        transform: scale(0);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes twinkle {
    from {
        transform: scale(.7);
        opacity: .35;
    }
    to {
        transform: scale(1.5);
        opacity: 1;
    }
}

@keyframes introAppear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style></head><body><div class="scene"><div class="moon"></div>

<div class="star s1"></div>
<div class="star s2"></div>
<div class="star s3"></div>
<div class="star s4"></div>
<div class="star s5"></div>
<div class="star s6"></div>
<div class="star s7"></div>
<div class="star s8"></div>
<div class="star s9"></div>
<div class="star s10"></div>

<div class="glow"></div>

<div class="intro">
    <p>TONIGHT, UNDER THE SAME MOON...</p>

    <h1>
        For someone who makes<br>
        ordinary days feel<br>
        a little less ordinary. 🌙
    </h1>
</div>

</div></body>
  </html>
